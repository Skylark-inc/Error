
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f9e5e5">

  <title>Error | Skylark</title>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Segoe UI", sans-serif;
      color-scheme: light;
      --text: #522d2d;
      --muted: #855e5e;
      --accent: #b95757;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      background: #f9e5e5;
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -35%;
      z-index: -1;
      background:
        radial-gradient(
          ellipse at 20% 25%,
          #f2b9b9 0%,
          transparent 48%
        ),
        radial-gradient(
          ellipse at 80% 70%,
          #ffe5e5 0%,
          transparent 55%
        ),
        radial-gradient(
          ellipse at 65% 15%,
          #f7cfcf 0%,
          transparent 45%
        );
      animation: drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes drift {
      0% {
        transform: translate(-3%, -2%) rotate(0deg);
      }
      50% {
        transform: translate(3%, 3%) rotate(5deg);
      }
      100% {
        transform: translate(-2%, 4%) rotate(-4deg);
      }
    }

    main {
      width: min(100%, 480px);
      padding: 48px 28px;
      text-align: center;
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(185, 87, 87, .10);
      color: var(--accent);
    }

    .icon svg {
      width: 38px;
      height: 38px;
    }

    h1 {
      font-size: clamp(29px, 6vw, 38px);
      font-weight: 700;
      letter-spacing: -1.2px;
      line-height: 1.15;
      margin: 0 0 20px;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
      margin: 0 auto 30px;
      max-width: 350px;
    }

    p a {
      color: #a34343;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 30px;
      background: var(--accent);
      border-radius: 13px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }

    .home:hover {
      background: #a74747;
      transform: translateY(-2px);
    }

    .home:active {
      transform: scale(.98);
    }

    a:focus-visible {
      outline: 3px solid #8c3636;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      .home {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.8"
           stroke-linecap="round"
           stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 7v6"/>
        <circle cx="12" cy="17" r=".8"
                fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <h1>An error has occurred</h1>

    <p>
      If you repeatedly encounter this error,
      please contact
      <a href="https://x.com/SkylarkSupport">
        SkylarkSupport
      </a>.
    </p>

    <a class="home"
       href="https://skylark-inc.github.io/">
      Return to Home
    </a>
  </main>
</body>
</html>
